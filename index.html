<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="食べきり"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>食べきり｜期限管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#213129;background:#f7f8f4}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(32px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer}header{max-width:650px;margin:auto;padding:16px 14px 7px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px;letter-spacing:.03em}small,.sub{color:#69746e;font-size:12px}main{max-width:650px;margin:auto;padding:0 14px}/* v0.2 compact inventory, tap name to edit and menu for secondary actions */
.toolbar{display:flex;gap:7px;margin:7px 0 10px}.toolbar button{background:#fff;border:1px solid #e1e6de;border-radius:11px;padding:9px 12px;color:#3b5147;font-size:13px}.toolbar button.active{background:#274f42;color:white}.toolbar .grow{flex:1}
.item{background:#fff;border:1px solid #e9ece5;border-radius:12px;padding:11px 12px;margin-bottom:6px;box-shadow:0 1px 4px #2a3d3009}
.itemmain{display:flex;align-items:center;gap:8px;min-height:46px}.iteminfo{flex:1;min-width:0}.namebtn{display:block;background:none;border:0;padding:0;color:#213129;font-weight:700;font-size:15px;text-align:left;max-width:100%;overflow-wrap:anywhere}.metarow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:11px;color:#69786e}.pill{border-radius:9px;padding:2px 6px;font-size:11px;white-space:nowrap;background:#e8f1e9;color:#336246}.pill.warn{background:#fff0d8;color:#9c5e13}.pill.late{background:#ffe3df;color:#a13d2e}
.quick{display:flex;align-items:center;gap:4px;flex-shrink:0}.quick button.step{width:34px;height:38px;border-radius:9px;border:1px solid #dfe8df;background:#f7faf7;font-size:22px;color:#285840;line-height:1}.num{min-width:49px;text-align:center;font-size:15px;font-weight:700;white-space:nowrap}.more{border:0;background:#f0f4f0;color:#486052;border-radius:9px;width:31px;height:38px;font-size:20px;flex-shrink:0}.segments{display:flex;gap:3px;flex:1;min-width:0}.segment{height:26px;min-width:0;flex:1;border:0;border-radius:4px;background:#e9ece8}.segment.on{background:#2f8468}.amount{font-size:12px;white-space:nowrap;min-width:34px;text-align:right}.gaugearea{display:flex;align-items:center;gap:9px;margin:5px 0 1px}.actions{display:flex;justify-content:flex-end;gap:7px;border-top:1px solid #edf0ea;margin-top:9px;padding-top:8px}.textbtn{border:1px solid #e1e8df;border-radius:9px;background:#fff;color:#4b6155;padding:8px 12px;font-size:12px}.textbtn.finish{background:#e5f1e9;border-color:#e5f1e9;color:#24533d;font-weight:700}.sub{color:#69746e;font-size:12px}.addTop{background:#285840!important;color:white!important;border-color:#285840!important;font-weight:700}.empty{padding:60px 20px;text-align:center;color:#68776d}.versionline{text-align:center;color:#9aa39c;font-size:11px;margin:16px}
.overlay{position:fixed;inset:0;background:#101d14a3;display:none;align-items:flex-end;justify-content:center;z-index:5}.overlay.show{display:flex}.modal{background:#fff;width:100%;max-width:650px;border-radius:24px 24px 0 0;padding:23px 20px calc(24px + env(safe-area-inset-bottom));max-height:94dvh;overflow:auto}.modal h2{margin:0 0 18px;font-size:21px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #cbd7ce;border-radius:12px;padding:12px;background:#fff;font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:#7b847e;margin-top:5px}.modalbuttons{display:flex;gap:8px}.modalbuttons button{flex:1;padding:13px;border:0;border-radius:12px;background:#e9eee9}.modalbuttons button.primary{background:#285840;color:#fff;font-weight:700}.hidden{display:none}.settings{padding:9px}.settings button{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e1e5de;padding:14px;border-radius:12px;margin-bottom:10px}.version{text-align:center;color:#9aa39c;font-size:11px;margin:26px}input[type=file]{display:none}</style></head><body>
<header><div><h1>食べきり</h1><div class="sub">期限までに、あと何回？</div></div><button id="settingsBtn" aria-label="設定" style="background:white;border:0;border-radius:11px;padding:9px;font-size:19px">⚙️</button></header><main><div class="toolbar"><button id="activeTab" class="active grow">期限順</button><button id="doneTab" class="grow">完了済み</button><button id="addBtn" class="addTop">＋ 登録</button></div><div id="items"></div></main>
<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><h2 id="formTitle">食品を登録</h2><form id="foodForm"><input type="hidden" id="editId"><div class="field"><label for="foodName">食品名</label><input id="foodName" required maxlength="100" placeholder="例：牛乳 1L" autocomplete="off"></div><div class="two"><div class="field"><label for="expiry">期限</label><input id="expiry" type="date" required></div><div class="field"><label for="mode">残数管理</label><select id="mode"><option value="count">あと○回</option><option value="gauge">10段階ゲージ</option><option value="none">なし</option></select></div></div><div class="field" id="countField"><label for="count">あと何回</label><input type="number" id="count" min="1" max="9999" value="1" inputmode="numeric"></div><div class="field hidden" id="gaugeField"><label for="gauge">現在の残量（10段階）</label><input type="range" id="gauge" min="0" max="10" value="10" step="1"><div class="hint" id="gaugeLabel">100%</div></div><div class="field"><label for="note">メモ（任意）</label><input id="note" maxlength="180" placeholder="例：開封後の目安期限"></div><div class="hint" style="margin:-4px 0 18px">開封後に期限が変わる食品は、編集から日付を変更できます。</div><div class="modalbuttons"><button type="button" id="cancel">キャンセル</button><button type="submit" class="primary">保存</button></div></form><div id="settingsPanel" class="settings hidden"><p class="hint">データはこの端末のブラウザ内にのみ保存します。公開サイト上に食品情報を送信しません。</p><button id="exportBtn">⬇ データをバックアップ（JSON）</button><button id="importBtn">⬆ バックアップから復元</button><input id="importFile" type="file" accept="application/json,.json"><div class="hint">復元すると現在の登録内容はバックアップの内容に置き換わります。アプリの削除やサイトデータ消去に備え、定期的なバックアップをおすすめします。</div><div class="version">食べきり v0.2</div><div class="modalbuttons"><button type="button" id="closeSettings">閉じる</button></div></div></div></div>
<script>
'use strict';const $=id=>document.getElementById(id);let db,foods=[],showDone=false,openMenuId=null;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('tabekiri-db',1);r.onupgradeneeded=()=>{r.result.createObjectStore('foods',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode='readonly'){return db.transaction('foods',mode).objectStore('foods')}
function allFoods(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function putFood(food){return new Promise((resolve,reject)=>{const r=tx('readwrite').put(food);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function clearAndPut(arr){return new Promise((resolve,reject)=>{const t=db.transaction('foods','readwrite');const s=t.objectStore('foods');s.clear();arr.forEach(x=>s.put(x));t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function dateDiff(str){const [y,m,d]=str.split('-').map(Number);const target=Date.UTC(y,m-1,d);const now=new Date();return Math.round((target-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}
function dateLabel(s){const diff=dateDiff(s);if(diff<0)return `${Math.abs(diff)}日超過`;if(diff===0)return '今日まで';if(diff===1)return '明日まで';return `あと${diff}日`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){foods=await allFoods();render()}
function render(){
$('activeTab').classList.toggle('active',!showDone);$('doneTab').classList.toggle('active',showDone);
const list=foods.filter(f=>!!f.done===showDone).sort((a,b)=>showDone?(b.doneAt||'').localeCompare(a.doneAt||''):a.expiry.localeCompare(b.expiry));
$('items').innerHTML=list.length?list.map(f=>{
const diff=dateDiff(f.expiry),cl=diff<0?'late':diff<=3?'warn':'';
const common=`data-id="${esc(f.id)}"`;
const name=`<div class="iteminfo"><button class="namebtn" data-act="edit" ${common}>${esc(f.name)}</button><div class="metarow"><span>${esc(f.expiry.slice(5).replace('-','/'))}</span><span class="pill ${cl}">${f.done?'完了':dateLabel(f.expiry)}</span>${f.note?`<span>${esc(f.note)}</span>`:''}</div></div>`;
let ctrl='';
if(f.done) ctrl='<span class="sub">消費完了</span>';
else if(f.mode==='count') ctrl=`<div class="quick"><button class="step" data-act="minus" ${common} aria-label="${esc(f.name)}を1回減らす">−</button><span class="num">${f.count}回</span><button class="step" data-act="plus" ${common} aria-label="${esc(f.name)}を1回増やす">＋</button></div>`;
else if(f.mode==='none') ctrl='<span class="sub">期限のみ</span>';
const gauge=(!f.done&&f.mode==='gauge')?`<div class="gaugearea"><div class="segments" role="group" aria-label="${esc(f.name)}の残量">${Array.from({length:10},(_,i)=>`<button class="segment ${i<f.gauge?'on':''}" data-act="gauge" data-level="${i+1}" ${common} aria-label="残量${(i+1)*10}%"></button>`).join('')}</div><span class="amount">${f.gauge*10}%</span></div>`:'';
const actions=openMenuId===f.id?`<div class="actions">${f.done?`<button class="textbtn finish" data-act="undo" ${common}>元に戻す</button>`:`<button class="textbtn finish" data-act="done" ${common}>完了 ✓</button>`}<button class="textbtn" data-act="edit" ${common}>編集</button><button class="textbtn" data-act="delete" ${common}>削除</button></div>`:'';
return `<article class="item"><div class="itemmain">${name}${ctrl}<button class="more" data-act="more" ${common} aria-label="${esc(f.name)}のその他の操作" aria-expanded="${openMenuId===f.id}">⋯</button></div>${gauge}${actions}</article>`;
}).join(''):'<div class="empty">'+(showDone?'完了した食品はまだありません':'まだ登録がありません。<br>「＋ 登録」から始めましょう。')+'</div>';
}
function modal(show){$('overlay').classList.toggle('show',show)}function fields(){const mode=$('mode').value;$('countField').classList.toggle('hidden',mode!=='count');$('gaugeField').classList.toggle('hidden',mode!=='gauge')}
function edit(f=null){$('settingsPanel').classList.add('hidden');$('foodForm').classList.remove('hidden');$('formTitle').textContent=f?'食品を編集':'食品を登録';$('editId').value=f?.id||'';$('foodName').value=f?.name||'';$('expiry').value=f?.expiry||new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('mode').value=f?.mode||'count';$('count').value=f?.count??1;$('gauge').value=f?.gauge??10;$('gaugeLabel').textContent=$('gauge').value*10+'%';$('note').value=f?.note||'';fields();modal(true)}
$('foodForm').onsubmit=async e=>{e.preventDefault();let id=$('editId').value;let f=foods.find(x=>x.id===id);let mode=$('mode').value;let count=Number($('count').value);if(mode==='count'&&(!Number.isInteger(count)||count<1||count>9999)){alert('残り回数は1〜9999で入力してください');return}let obj={id:id||crypto.randomUUID(),name:$('foodName').value.trim(),expiry:$('expiry').value,mode,count:mode==='count'?count:null,gauge:mode==='gauge'?Number($('gauge').value):null,note:$('note').value.trim(),done:f?.done||false,doneAt:f?.doneAt||null,createdAt:f?.createdAt||new Date().toISOString()};if(!obj.name)return;await putFood(obj);modal(false);await refresh()};
$('items').onclick=async e=>{let b=e.target.closest('button[data-act]');if(!b)return;let id=b.dataset.id,act=b.dataset.act,f=foods.find(x=>x.id===id);if(!f)return;if(act==='more'){openMenuId=openMenuId===id?null:id;render();return}if(act==='edit'){edit(f);return}if(act==='delete'){if(confirm(`「${f.name}」を削除しますか？`)){await putFood({...f,deleted:true});await clearAndPut(foods.filter(x=>x.id!==id));await refresh()}return}if(act==='minus')f.count=Math.max(0,f.count-1);if(act==='plus')f.count=Math.min(9999,f.count+1);if(act==='gauge')f.gauge=Number(b.dataset.level);if(act==='done'||act==='undo'){f.done=act==='done';f.doneAt=f.done?new Date().toISOString():null}if((act==='minus'&&f.count===0)||(act==='gauge'&&f.gauge===0)){if(confirm('残量が0になりました。完了にしますか？')){f.done=true;f.doneAt=new Date().toISOString()}}await putFood(f);await refresh()};
$('addBtn').onclick=()=>edit();$('cancel').onclick=()=>modal(false);$('overlay').onclick=e=>{if(e.target===$('overlay'))modal(false)};$('mode').onchange=fields;$('gauge').oninput=()=>$('gaugeLabel').textContent=$('gauge').value*10+'%';$('activeTab').onclick=()=>{showDone=false;openMenuId=null;render()};$('doneTab').onclick=()=>{showDone=true;openMenuId=null;render()};$('settingsBtn').onclick=()=>{$('foodForm').classList.add('hidden');$('settingsPanel').classList.remove('hidden');$('formTitle').textContent='設定とバックアップ';modal(true)};$('closeSettings').onclick=()=>modal(false);
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'tabekiri',version:1,exportedAt:new Date().toISOString(),foods},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='tabekiri-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.app!=='tabekiri'||!Array.isArray(data.foods)||!data.foods.every(f=>typeof f.id==='string'&&typeof f.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(f.expiry)&&['count','gauge','none'].includes(f.mode)))throw new Error('形式が違います');if(confirm(`バックアップの${data.foods.length}件で現在のデータを置き換えますか？`)){await clearAndPut(data.foods);await refresh();modal(false)}}catch(err){alert('復元できませんでした。食べきりのバックアップファイルを選択してください。')}e.target.value=''};
(async()=>{try{db=await openDB();await refresh()}catch(e){alert('端末内の保存領域にアクセスできません。Safariの通常モードで開いてください。');console.error(e)}})();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(console.error);
</script></body></html>
